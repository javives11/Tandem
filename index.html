<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tandem</title>
<meta name="theme-color" content="#F3F0F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tandem">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-tandem" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link id="font-cobalt" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0F7; --surface:#FFFFFF; --sunk:#E8E3F0; --ink:#2A2238; --muted:#6B6280; --line:#DDD6E8;
  --accent:#2F6F6A; --accent-ink:#FFFFFF; --star:#F2A93B; --ok:#2F8F5B; --danger:#C9405A;
  --shadow:0 1px 0 rgba(42,34,56,.05), 0 10px 24px -14px rgba(42,34,56,.35);
  --tint:14%; --hw:600;
  --font:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-head:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17131F; --surface:#221C2D; --sunk:#2D2539; --ink:#F1ECF7; --muted:#A99FBC; --line:#352C44;
    --accent:#6FD1C4; --accent-ink:#10201E; --star:#FFC45C; --ok:#5FD39A; --danger:#FF7A90;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 26px -14px rgba(0,0,0,.7); --tint:20%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17131F; --surface:#221C2D; --sunk:#2D2539; --ink:#F1ECF7; --muted:#A99FBC; --line:#352C44;
  --accent:#6FD1C4; --accent-ink:#10201E; --star:#FFC45C; --ok:#5FD39A; --danger:#FF7A90;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 26px -14px rgba(0,0,0,.7); --tint:20%;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);transition:background .25s;font-size:16px;line-height:1.45;min-height:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,.brand,.th-num,.day-label b,.cell span:first-child{font-family:var(--font-head)}

/* Person tint: a soft wash of someone's color over the surface */
.tinted,.ev,.col,.glance-m,.slot.who{background:var(--sunk);background:color-mix(in srgb,var(--c) var(--tint),var(--surface))}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.brand{font-weight:var(--hw);font-size:22px;display:flex;align-items:center;gap:9px}
.brand i{width:26px;height:16px;display:inline-block;position:relative}
.brand i::before,.brand i::after{content:"";position:absolute;top:0;width:16px;height:16px;border-radius:50%;background:var(--m1,var(--accent));mix-blend-mode:multiply}
.brand i::after{left:10px;background:var(--m2,var(--star))}
:root[data-theme="dark"] .brand i::before,:root[data-theme="dark"] .brand i::after{mix-blend-mode:screen}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--ok)}
.sync.warn::before{background:var(--star)}

main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:12px;color:var(--muted);font-weight:700;min-height:58px}
.tab svg{width:56px;height:30px;padding:3px 16px;border-radius:999px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:background .2s}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{background:var(--sunk);background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);stroke-width:2.2}

/* Shared bits */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 16px}
.hero h1{margin:0;font-size:clamp(36px,10vw,52px);line-height:.95;font-weight:var(--hw)}
.hero p{margin:6px 0 0;color:var(--muted);font-size:15px;font-weight:600}
.navrow{display:flex;gap:6px;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;border:1.5px solid var(--line)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:disabled{opacity:.35;pointer-events:none}
.pill{height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;font-size:14px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px}
.seg button{min-height:38px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:700;border:2px solid var(--line)}
.chip.on{border-color:var(--c,var(--accent));background:var(--sunk);background:color-mix(in srgb,var(--c,var(--accent)) var(--tint),var(--surface))}
.chip.plain{padding:6px 16px}
.av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-size:14px;font-weight:800;line-height:1;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.av.sm{width:24px;height:24px;font-size:11px;margin-left:-7px;border:2px solid var(--surface)}
.av.sm:first-child{margin-left:0}
.av.lg{width:48px;height:48px;font-size:21px}
.av.ghost{background:transparent;border:2px dashed var(--line);text-shadow:none}
.card{background:var(--surface);border-radius:22px;padding:16px}
.lift{box-shadow:var(--shadow)}
.empty{color:var(--muted);font-size:15px}
.section-title{font-size:20px;font-weight:var(--hw);margin:28px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{color:var(--accent);font-weight:800;font-size:15px;min-height:44px;display:inline-flex;align-items:center;font-family:var(--font)}
.fab{position:fixed;right:max(18px,calc(50vw - 342px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;height:56px;padding:0 22px 0 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 12px 26px -12px var(--accent)}
.fab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round}

/* Signature: the little tandem bike */
.bike{display:block;width:120px;height:auto;color:var(--ink);overflow:visible}
.bike .wh{transform-box:fill-box;transform-origin:center}
.bike.ride{animation:ride 2.4s cubic-bezier(.45,0,.3,1) var(--fxd,0ms) both}
.bike.ride .wh{animation:spin .5s linear var(--fxd,0ms) 5}
@keyframes ride{0%{transform:translateX(0)}42%{transform:translateX(110vw)}42.1%{transform:translateX(-110vw)}100%{transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Today glance (top of the calendar) */
.th{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 0 18px}
.th-date{display:flex;flex-direction:column}
.th-dow{font-size:21px;font-weight:800;color:var(--accent)}
.th-num{font-size:clamp(84px,26vw,120px);line-height:.8;font-weight:var(--hw);letter-spacing:-.02em;margin:4px 0 6px}
.th-mon{font-size:21px;font-weight:800;color:var(--muted)}
.th-side{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.th .bike{width:128px}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.glance-m{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;border-radius:22px;padding:12px;min-height:76px}
.glance-m .ring{grid-row:1/3}
.glance-m b{display:block;font-size:17px;font-weight:800;line-height:1.15}
.glance-m small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.glance-m .stars{grid-column:2;justify-self:start;margin-top:4px}
.dinner{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.dinner .emo{font-size:30px;line-height:1;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--sunk);flex:none}
.dinner b{display:block;font-size:19px;font-weight:800;line-height:1.2}
.dinner small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.dinner.none{box-shadow:none;background:transparent;border:2px dashed var(--line);color:var(--muted)}
.dinner.none b{color:var(--ink);font-size:17px}

/* Calendar: week */
.days{display:flex;flex-direction:column;gap:14px}
.day{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.day-label{text-align:center;padding-top:6px}
.day-label small{display:block;font-size:13px;color:var(--muted);font-weight:800}
.day-label b{display:block;font-size:28px;line-height:1.05;font-weight:var(--hw)}
.day.today .day-label b{color:var(--accent-ink);background:var(--accent);border-radius:999px;width:44px;margin:2px auto 0;padding:4px 0}
.day.today .day-label small{color:var(--accent)}
.day-body{display:flex;flex-direction:column;gap:8px;min-height:56px}
.free{display:flex;align-items:center;min-height:56px;padding:0 16px;border-radius:18px;border:2px dashed var(--line);color:var(--muted);font-size:15px;font-weight:600;width:100%;text-align:left}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;min-height:58px;border-radius:18px;padding:10px 12px 10px 14px}
.ev.duo{background:linear-gradient(105deg,color-mix(in srgb,var(--c) var(--tint),var(--surface)) 40%,color-mix(in srgb,var(--c2) var(--tint),var(--surface)) 80%)}
.ev-t{font-size:13px;font-weight:800;min-width:58px;line-height:1.2;color:var(--ink);color:color-mix(in srgb,var(--c) 50%,var(--ink))}
.ev-t small{display:block;font-weight:700;opacity:.75}
.ev-n{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.ev-who{display:flex}
.ev-who .av.sm{border-color:transparent;box-shadow:0 0 0 2px var(--surface)}
.addday{font-size:14px;color:var(--muted);font-weight:800;text-align:left;padding:0 6px;min-height:36px}

/* Calendar: month */
.month{background:var(--surface);border-radius:24px;padding:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.month .dow{text-align:center;font-size:13px;color:var(--muted);font-weight:800;padding:4px 0}
.cell{min-height:52px;aspect-ratio:1/1.08;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:5px;font-weight:600;font-size:17px}
.cell.out{color:var(--muted);opacity:.45}
.cell.today span:first-child{color:var(--accent);font-weight:700}
.cell.sel{background:var(--accent);color:var(--accent-ink)}
.cell.sel span:first-child{color:inherit}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:12px;height:5px;border-radius:5px;background:var(--c)}
.cell.sel .dots i{box-shadow:0 0 0 1.5px var(--accent-ink)}

/* Daily: chore columns */
.kids{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(156px,1fr))}
.col{border-radius:26px;padding:16px 10px 6px}
.kid-head{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:8px;text-align:center}
.kid-head h3{margin:0;font-size:19px;font-weight:var(--hw);line-height:1.1}
.ring{--p:0;flex:none;display:inline-grid;place-items:center;border-radius:50%;padding:5px;background:var(--line);background:conic-gradient(var(--c) calc(var(--p)*1%),color-mix(in srgb,var(--c) 28%,var(--surface)) 0)}
.ring>.av{box-shadow:0 0 0 2.5px var(--surface)}
.ring.done{animation:none}
.stars{font-weight:800;display:inline-flex;align-items:center;gap:4px;font-size:15px;background:var(--surface);border-radius:999px;padding:3px 11px 3px 9px}
.star{color:var(--star)}
.stars.fx{animation:bump .5s var(--fxd,0ms) both}
@keyframes bump{40%{transform:scale(1.22)}}
.chore{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:58px;padding:7px 4px;border-top:1.5px solid var(--line);border-top-color:color-mix(in srgb,var(--c) 22%,transparent)}
.kid-head+.chore,.kid-head+.habit .chore{border-top:0}
.tick{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--c);background:var(--surface);display:grid;place-items:center}
.tick svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick svg path{stroke-dasharray:24}
.chore.done .tick{background:var(--c)}
.chore.done .tick svg{opacity:1}
.chore.done .chore-n{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.chore-n{flex:1;min-width:0;font-weight:700;line-height:1.25;word-break:break-word}
.chore-s{display:inline-block;width:100%;margin-top:1px;font-size:13px;color:var(--muted);font-weight:800;white-space:nowrap;text-decoration:none}
.fx .tick{animation:fill .5s var(--fxd,0ms) both}
.fx .tick svg path{animation:draw .35s calc(var(--fxd,0ms) + 120ms) both}
@keyframes fill{0%{transform:scale(.75)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.plus1{position:absolute;left:10px;top:4px;font-weight:800;font-size:14px;color:var(--ink);background:var(--surface);border-radius:999px;padding:2px 8px;pointer-events:none;box-shadow:var(--shadow);animation:float .95s var(--fxd,0ms) both}
.plus1 b{color:var(--star)}
@keyframes float{0%{opacity:0;transform:translateY(6px) scale(.8)}25%{opacity:1;transform:translateY(-8px) scale(1)}100%{opacity:0;transform:translateY(-34px)}}
.alldone{overflow:hidden;display:flex;align-items:center;gap:14px;border-radius:22px;padding:12px 16px;margin-bottom:12px;background:var(--surface)}
.alldone .bike{width:96px;flex:none}
.alldone b{font-size:16px;font-weight:800;line-height:1.3}
.rewards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.rewards::-webkit-scrollbar{display:none}
.reward{flex:0 0 148px;scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;gap:4px;border:1.5px solid var(--line)}
.reward .emo{font-size:32px;line-height:1;margin-bottom:4px}
.reward b{font-size:16px;font-weight:800;line-height:1.25}
.reward small{color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 0;border-top:1.5px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0;font-weight:700}
.row small{display:block;color:var(--muted);font-size:13px;font-weight:600}

/* Meals */
.mealday{margin-bottom:18px}
.mealday h3{margin:0 0 8px;font-size:18px;font-weight:var(--hw)}
.mealday.today h3{color:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:600px){.slots{grid-template-columns:repeat(4,1fr)}}
.slot{position:relative;background:var(--surface);border-radius:18px;padding:12px 14px;text-align:left;min-height:72px;display:flex;flex-direction:column;gap:2px}
.slot small{font-size:13px;color:var(--muted);font-weight:800}
.slot.who small{color:var(--ink);color:color-mix(in srgb,var(--c) 50%,var(--ink))}
.slot b{font-weight:800;font-size:16px;line-height:1.25;padding-right:22px}
.slot .av{position:absolute;right:10px;top:10px}
.slot.fx{animation:popin .45s var(--fxd,0ms) both}
@keyframes popin{0%{transform:scale(.88);opacity:.3}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
.mealday .addday{margin-top:4px}
.seg.mealtype{display:flex;width:100%}
.seg.mealtype button{flex:1;padding:0 4px}

/* Lists */
.addbar{display:flex;gap:8px;margin-bottom:14px}
.addbar input{flex:1;min-width:0;height:52px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:0 18px;font-size:16px}
.addbar>button[data-act="addItem"]{height:52px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800}
.whopick,.whob{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.addbar .whopick{width:52px;height:52px;background:var(--surface);border:1.5px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;min-height:58px;padding:6px 0;border-top:1.5px solid var(--line)}
.item:first-child{border-top:0}
.item .tick{width:30px;height:30px;border-width:2.5px;margin:7px}
.item .tick svg{width:16px;height:16px}
.item.done .tick{background:var(--c)}
.item.done .tick svg{opacity:1}
.item.done .item-n{text-decoration:line-through;color:var(--muted)}
.item.fx .tick{animation:fill .45s var(--fxd,0ms) both}
.item-n{flex:1;min-width:0;word-break:break-word;font-weight:700}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.x svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(20,14,32,.45)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.8,.3,1)}
@media (min-width:600px){.sheet-wrap{align-items:center}.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 16px;font-size:26px;font-weight:var(--hw)}
.sheet h2 small{display:block;font-family:var(--font);font-size:15px;font-weight:700;color:var(--muted);margin-top:2px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>span{font-size:14px;font-weight:800;color:var(--muted)}
.field input[type=text],.field input[type=password],.field input[type=date],.field input[type=time],.field select,.field textarea{width:100%;min-height:50px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);padding:12px 14px;font-size:16px}
.field textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;font-weight:700;min-height:44px}
.toggle input{width:24px;height:24px;accent-color:var(--accent)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{height:46px;border-radius:14px;background:var(--sunk);font-weight:800;color:var(--muted)}
.daypick button.on{background:var(--accent);color:var(--accent-ink)}
.quick{display:flex;gap:14px;margin-top:4px}
.quick button{font-size:14px;font-weight:800;color:var(--accent);min-height:40px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swatches button.on{border-color:var(--surface);box-shadow:0 0 0 3px var(--c)}
.actions{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;min-height:52px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;padding:0 18px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);flex:0 0 auto;padding:0 12px}
.note{font-size:14px;color:var(--muted);margin:-6px 0 14px}

.welcome{padding:28px 0}
.welcome .bike{width:180px;margin:0 0 22px}
.welcome h1{font-size:clamp(38px,11vw,58px);line-height:.98;margin:0 0 12px;font-weight:var(--hw)}
.welcome p{color:var(--muted);max-width:44ch;margin:0 0 22px;font-size:17px;font-weight:600}
.welcome .btn{flex:none;display:inline-block}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-weight:700}
.emptyart{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 8px 8px;gap:10px}
.emptyart .bike{width:140px}
.help{font-size:15px;color:var(--muted)}
.help p{margin:0 0 10px}
.help b{color:var(--ink)}

.habit .chore{flex-wrap:wrap}
.habit .chore-n small.streak{display:block;font-size:13px;color:var(--muted);font-weight:700;text-decoration:none}
.habit .chore.done .chore-n{text-decoration:none;color:var(--ink)}
.hdots{display:flex;gap:4px;width:100%;padding-left:54px}
.hdots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--c)}
.hdots i.on{background:var(--c)}
.hdots i.off{border-color:var(--line);border-style:dashed}
.looks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.looks{grid-template-columns:repeat(3,1fr)}}
.look{border-radius:20px;padding:10px;text-align:left;border:2.5px solid var(--line);background:var(--lb);color:var(--li)}
.look.on{border-color:var(--accent)}
.look .mini{border-radius:12px;background:var(--ls);padding:8px;display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.look .mini i{display:block;height:7px;border-radius:4px;background:var(--ll)}
.look .mini i:first-child{width:55%;height:11px;background:var(--li)}
.look .mini span{display:flex;gap:4px;margin-top:2px}
.look .mini span b{width:14px;height:14px;border-radius:50%;background:var(--la)}
.look .mini span b+b{background:var(--lst)}
.look strong{display:block;font-size:16px}
.look small{display:block;font-size:13px;opacity:.75;line-height:1.3}
#toast{position:fixed;left:50%;bottom:calc(152px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;max-width:min(92vw,440px);transition:.25s;z-index:30;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .plus1{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><i aria-hidden="true"></i>Tandem</div>
  <div id="sync" class="sync">Loading</div>
</div></header>

<main id="view"><div class="wrap loading">Loading your board…</div></main>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button class="tab" data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
  <button class="tab" data-tab="chores"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></svg>Daily</button>
  <button class="tab" data-tab="meals"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0zM9 7c0-1.5 1-1.5 1-3M13 7c0-1.5 1-1.5 1-3"/></svg>Meals</button>
  <button class="tab" data-tab="lists"><svg viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1.1"/><circle cx="4.8" cy="12" r="1.1"/><circle cx="4.8" cy="17.5" r="1.1"/></svg>Lists</button>
  <button class="tab" data-tab="family"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.3"/><path d="M3 19.5c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M16.5 14.6c2.3.2 4 1.6 4.5 4.4"/></svg>Family</button>
</div></nav>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="scrim" data-act="closeSheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const fromToday = s => (s < today() ? today() : s);
const weekStart = s => { const d = parse(s); d.setDate(d.getDate()-d.getDay()); return ymd(d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW1 = ['S','M','T','W','T','F','S'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m => m.slice(0,3));
const COLORS = ['#E4572E','#2F7FD6','#3E9B4F','#8E5BD8','#E8A317','#E0457B','#14A3A3','#6B7A99'];
const SLOTS = [['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snack','Snack']];
function fmtTime(t){ if(!t) return ''; let [h,m] = t.split(':').map(Number); const ap = h>=12?'pm':'am'; h = h%12||12; return m ? `${h}:${pad(m)} ${ap}` : `${h} ${ap}`; }
function niceDate(s){ const d = parse(s); return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; }
const icon = {
  left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- data store (Google Sheet, reached through your Apps Script link in config.js) ---------- */
const COLS = ['members','events','chores','choreDone','rewards','redemptions','meals','lists','items','habits','habitDone'];
let S = Object.fromEntries(COLS.map(c => [c, new Map()]));
let mode = 'loading', version = -1, TOKEN = '', ME = '';
const TKEY = 'tandem-session', API_URL = (window.TANDEM_SERVER_URL || '').trim();
try { const t = JSON.parse(localStorage.getItem(TKEY) || '{}'); TOKEN = t.token || ''; ME = t.name || ''; } catch(e){}

async function api(action, data = {}){
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL)){ const e = new Error('NO_URL'); e.code = 'NO_URL'; throw e; }
  let r;
  try {
    r = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: TOKEN, ...data }) });
  } catch(err){ const e = new Error('NETWORK'); e.code = 'NETWORK'; throw e; }
  let j; try { j = await r.json(); } catch(err){ const e = new Error('BAD_RESPONSE'); e.code = 'BAD_RESPONSE'; throw e; }
  if(j.error){ const e = new Error(j.error); e.code = j.error; e.info = j; throw e; }
  return j;
}
const isBadSession = e => e && e.code === 'BAD_SESSION';

const pending = new Map();
let inflight = false, flushT = 0, needRefresh = false, failed = false;
function queueOp(op){
  pending.set(op.col + '/' + op.id, op);
  clearTimeout(flushT); flushT = setTimeout(flush, 350);
  render();
}
async function flush(){
  if(inflight || !pending.size) return;
  const ops = [...pending.values()]; pending.clear(); inflight = true; render();
  let ok = false;
  try {
    const r = await api('write', { ops });
    if(r.prev === version) version = r.version; else needRefresh = true;
    ok = true; failed = false;
  } catch(e){
    if(isBadSession(e)){ inflight = false; return signOut(true); }
    failed = true;
    ops.forEach(o => { const k = o.col + '/' + o.id; if(!pending.has(k)) pending.set(k, o); });
    toast('Couldn’t save just now. Trying again in a few seconds.');
  } finally { inflight = false; }
  if(!ok){ clearTimeout(flushT); flushT = setTimeout(flush, 5000); render(); return; }
  if(pending.size){ flush(); return; }
  if(needRefresh){ needRefresh = false; refresh(); }
  render();
}
function put(col, id, data){ S[col].set(id, data); queueOp({ op:'set', col, id, data }); }
function del(col, id){ S[col].delete(id); queueOp({ op:'del', col, id }); }
const all = col => [...S[col]].map(([id, v]) => ({ id, ...v }));

async function refresh(){
  if(inflight || pending.size){ needRefresh = true; return; }
  try {
    const r = await api('getAll');
    if(inflight || pending.size){ needRefresh = true; return; }
    COLS.forEach(c => { S[c] = new Map(Object.entries(r.data[c] || {})); });
    version = r.version; mode = 'synced'; failed = false;
  } catch(e){
    if(isBadSession(e)) return signOut(true);
    if(mode === 'loading') mode = 'offline';
    failed = true;
  }
  render();
}
async function poll(){
  if(mode !== 'synced' && mode !== 'offline') return;
  if(document.hidden || inflight || pending.size) return;
  try { const r = await api('getVersion'); failed = false; if(r.version !== version) refresh(); else render(); }
  catch(e){ if(isBadSession(e)) signOut(true); else { failed = true; render(); } }
}
function signOut(expired){
  if(TOKEN && !expired) api('logout').catch(() => {});
  TOKEN = ''; ME = ''; try { localStorage.removeItem(TKEY); } catch(e){}
  COLS.forEach(c => S[c] = new Map()); pending.clear(); version = -1;
  mode = 'locked'; render();
  if(expired) toast('Please sign in again.');
}
function boot(){
  if(!TOKEN){ mode = 'locked'; render(); }
  else refresh();
  setInterval(poll, 12000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) poll(); });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
let signingIn = false;
async function unlock(){
  if(signingIn) return;
  const user = ($('#userIn')?.value || '').trim(), pass = $('#passIn')?.value || '';
  if(!user || !pass){ toast('Enter your name and passcode.'); return; }
  signingIn = true; const btn = $('[data-act="unlock"]'); if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
  try {
    const r = await api('login', { user, pass });
    TOKEN = r.token; ME = r.name;
    try { localStorage.setItem(TKEY, JSON.stringify({ token: TOKEN, name: ME })); } catch(e){}
    mode = 'loading'; signingIn = false; render(); refresh();
  } catch(e){
    signingIn = false; if(btn){ btn.disabled = false; btn.textContent = 'Sign in'; }
    const msg = {
      BAD_LOGIN: `That name and passcode don’t match.${e.info && e.info.left ? ` ${e.info.left} ${e.info.left === 1 ? 'try' : 'tries'} left before a short lockout.` : ''}`,
      LOCKED: `Too many tries. Wait ${e.info?.minutes || 15} minutes, then try again.`,
      NOT_SET_UP: 'Finish setting your names and passcodes in Code.gs, then deploy a new version.',
      NO_URL: 'Add your Apps Script link to config.js first.',
      NETWORK: 'Can’t reach the server. Check your connection.',
    }[e.code] || 'Something went wrong signing in. Try again.';
    toast(msg);
    const p = $('#passIn'); if(p){ p.value = ''; p.focus(); }
  }
}
function armed(b){
  if(b.dataset.armed) return true;
  b.dataset.armed = '1'; const t = b.textContent; b.textContent = 'Tap again';
  setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = t; } }, 3000);
  return false;
}

/* ---------- themes (saved per phone) ---------- */
const THEMES = {
  tandem: { name:'Tandem', blurb:'Soft lilac, teal and a little bike', font:'"Nunito",ui-rounded,system-ui,sans-serif', head:'"Fredoka","Nunito",ui-rounded,system-ui,sans-serif', hw:600, href:'',
    light:{ bg:'#F3F0F7', surface:'#FFFFFF', sunk:'#E8E3F0', ink:'#2A2238', muted:'#6B6280', line:'#DDD6E8', accent:'#2F6F6A', 'accent-ink':'#FFFFFF', star:'#F2A93B', ok:'#2F8F5B', danger:'#C9405A' },
    dark:{ bg:'#17131F', surface:'#221C2D', sunk:'#2D2539', ink:'#F1ECF7', muted:'#A99FBC', line:'#352C44', accent:'#6FD1C4', 'accent-ink':'#10201E', star:'#FFC45C', ok:'#5FD39A', danger:'#FF7A90' } },
  cobalt: { name:'Cobalt', blurb:'Crisp blue, clean and modern', font:'"Bricolage Grotesque",ui-rounded,system-ui,sans-serif', head:'', href:'',
    light:{ bg:'#EDF1F7', surface:'#FFFFFF', sunk:'#E3E8F1', ink:'#17213A', muted:'#5C6880', line:'#D5DCE8', accent:'#2F55E0', 'accent-ink':'#FFFFFF', star:'#F5B81F', ok:'#1F9D6B', danger:'#D23B3B' },
    dark:{ bg:'#0E1322', surface:'#171E33', sunk:'#202945', ink:'#E9EDF6', muted:'#97A2BB', line:'#2A3452', accent:'#7C98FF', 'accent-ink':'#0E1322', star:'#FFCB45', ok:'#3CC48C', danger:'#FF6B6B' } },
  garden: { name:'Garden', blurb:'Leafy greens with a bookish serif', font:'"Figtree",system-ui,sans-serif', head:'"Young Serif",Georgia,serif', hw:400,
    href:'https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap',
    light:{ bg:'#EBF1E8', surface:'#FFFFFF', sunk:'#DDE7D8', ink:'#1D2A21', muted:'#5E6E62', line:'#D0DBCB', accent:'#2E7A4D', 'accent-ink':'#FFFFFF', star:'#E3A22F', ok:'#2E7A4D', danger:'#C2453B' },
    dark:{ bg:'#101912', surface:'#18241B', sunk:'#213025', ink:'#E5EEE6', muted:'#99AD9E', line:'#2B3B2F', accent:'#72D19A', 'accent-ink':'#101912', star:'#F2C14E', ok:'#72D19A', danger:'#FF7B6E' } },
  citrus: { name:'Citrus', blurb:'Sunny, bouncy, kid-friendly', font:'"Baloo 2",ui-rounded,system-ui,sans-serif', head:'',
    href:'https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap',
    light:{ bg:'#FFF2C4', surface:'#FFFFFF', sunk:'#FFE59A', ink:'#2A2340', muted:'#6E6582', line:'#F0DB93', accent:'#E23E76', 'accent-ink':'#FFFFFF', star:'#F08C00', ok:'#1E9E68', danger:'#D0342C' },
    dark:{ bg:'#1D1A2C', surface:'#28243B', sunk:'#343050', ink:'#F6F2FF', muted:'#ADA6C6', line:'#3D3858', accent:'#FF7AA6', 'accent-ink':'#1D1A2C', star:'#FFC233', ok:'#4CD49A', danger:'#FF7066' } },
  dusk: { name:'Dusk', blurb:'Calm lavender, gold at night', font:'"Manrope",system-ui,sans-serif', head:'',
    href:'https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap',
    light:{ bg:'#F0EFFA', surface:'#FFFFFF', sunk:'#E3E1F4', ink:'#1D1B3A', muted:'#615E85', line:'#D8D5EE', accent:'#5A49D4', 'accent-ink':'#FFFFFF', star:'#E7A400', ok:'#21976A', danger:'#CF3E4F' },
    dark:{ bg:'#0B1026', surface:'#151B3A', sunk:'#1F2750', ink:'#EDEBFF', muted:'#A2A6CC', line:'#2A3263', accent:'#FFC857', 'accent-ink':'#0B1026', star:'#FFC857', ok:'#4ADE80', danger:'#FF7A8A' } }
};
const LOOK_KEY = 'tandem-look';
let look = { theme:'tandem', mode:'auto' };
try { look = Object.assign(look, JSON.parse(localStorage.getItem(LOOK_KEY) || '{}')); } catch(e){}
if(!THEMES[look.theme]) look.theme = 'tandem';
const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
function isDark(){ return look.mode === 'dark' || (look.mode === 'auto' && darkMQ.matches); }
function loadFont(key){
  const t = THEMES[key]; if(!t.href || document.getElementById('font-' + key)) return;
  const l = document.createElement('link'); l.id = 'font-' + key; l.rel = 'stylesheet'; l.href = t.href; document.head.appendChild(l);
}
function applyLook(){
  const t = THEMES[look.theme], dark = isDark(), tok = dark ? t.dark : t.light, root = document.documentElement;
  loadFont(look.theme);
  Object.entries(tok).forEach(([k, v]) => root.style.setProperty('--' + k, v));
  root.style.setProperty('--shadow', dark ? '0 1px 0 rgba(0,0,0,.3), 0 12px 26px -14px rgba(0,0,0,.7)' : '0 1px 0 rgba(42,34,56,.05), 0 10px 24px -14px rgba(42,34,56,.35)');
  root.style.setProperty('--tint', dark ? '20%' : '14%');
  root.style.setProperty('--hw', String(t.hw || 800));
  root.style.setProperty('--font', t.font);
  root.style.setProperty('--font-head', t.head || t.font);
  root.style.colorScheme = dark ? 'dark' : 'light';
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  const tc = document.querySelector('meta[name=theme-color]'); if(tc) tc.setAttribute('content', tok.bg);
}
function setLook(patch){
  Object.assign(look, patch); try { localStorage.setItem(LOOK_KEY, JSON.stringify(look)); } catch(e){}
  applyLook(); render();
}
darkMQ.addEventListener && darkMQ.addEventListener('change', () => { if(look.mode === 'auto') applyLook(); });
applyLook();
function lookPicker(){
  return `<div class="looks">${Object.entries(THEMES).map(([k, t]) => { const c = isDark() ? t.dark : t.light;
    return `<button class="look ${look.theme===k?'on':''}" data-act="setTheme" data-k="${k}" aria-pressed="${look.theme===k}"
      style="--lb:${c.surface};--ls:${c.bg};--li:${c.ink};--ll:${c.line};--la:${c.accent};--lst:${c.star};font-family:${esc(t.head||t.font)}">
      <span class="mini"><i></i><i></i><i style="width:75%"></i><span><b></b><b></b></span></span>
      <strong>${t.name}</strong><small style="font-family:${esc(t.font)}">${t.blurb}</small></button>`; }).join('')}</div>
    <div class="toolbar" style="margin-top:12px"><span style="font-weight:600">Appearance</span><div class="seg">${[['auto','Auto'],['light','Light'],['dark','Dark']].map(([v,l]) =>
      `<button data-act="setMode" data-mode="${v}" aria-pressed="${look.mode===v}">${l}</button>`).join('')}</div></div>`;
}

/* ---------- UI state ---------- */
const st = {
  tab: 'cal', calMode: 'week', cursor: today(), selected: today(), filter: new Set(),
  choreDate: today(), choreMode: 'chores', mealWeek: today(), listId: null, showAllChores: false, itemWho: null
};
let sheet = null; // {kind, ...}

const members = () => all('members').sort((a,b) => (a.order??0)-(b.order??0) || a.name.localeCompare(b.name));
const mem = id => { const m = S.members.get(id); return m ? { id, ...m } : null; };
function avatar(m, cls=''){ if(!m) return ''; const t = m.emoji || (m.name||'?').trim().charAt(0).toUpperCase(); return `<span class="av ${cls}" style="--c:${esc(m.color)}" aria-hidden="true">${esc(t)}</span>`; }

function ring(m, p, cls='lg'){ return `<span class="ring" style="--c:${esc(m.color)};--p:${p}">${avatar(m, cls)}</span>`; }
const avById = id => avatar(mem(id), 'sm');

/* The little tandem bike: two riders in your two colors */
function bike(cls='', style=''){
  const ms = members(), a = ms[0]?.color || 'var(--accent)', b = (ms[1] || ms[0])?.color || 'var(--star)';

/* Small confirmation animations that survive a re-render (they resume where they were) */
const FX = new Map();
function fx(key, ms){ FX.set(key, { t: performance.now(), ms }); }
function fxStyle(key){
  const f = FX.get(key); if(!f) return '';
  const e = performance.now() - f.t; if(e > f.ms){ FX.delete(key); return ''; }
  return `style="--fxd:-${Math.round(e)}ms"`;
}
const fxOn = key => !!fxStyle(key);

/* ---------- render ---------- */
let raf = 0;
function scheduleRender(){ if(raf) return; raf = requestAnimationFrame(() => { raf = 0; render(); }); }
function render(){
  const sync = $('#sync');
  const status = mode === 'locked' ? ['Locked','warn'] : mode === 'loading' ? ['Loading',''] :
    (inflight || pending.size) ? ['Saving…','warn'] : failed ? ['Offline','warn'] : ['Synced','ok'];
  sync.textContent = status[0]; sync.className = 'sync ' + status[1];
  const ms0 = mode === 'synced' || mode === 'offline' ? members() : [], root = document.documentElement;
  ms0[0] ? root.style.setProperty('--m1', ms0[0].color) : root.style.removeProperty('--m1');
  ms0[1] ? root.style.setProperty('--m2', ms0[1].color) : root.style.removeProperty('--m2');
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === st.tab ? 'page' : 'false'));

  const view = $('#view');
  // keep focus and typing intact across re-renders
  const a = document.activeElement; let keep = null;
  if(a && a.id && view.contains(a)) keep = { id: a.id, v: a.value, s: a.selectionStart, e: a.selectionEnd };

  let html;
  if(mode === 'locked') html = viewLock();
  else if(mode === 'loading') html = `<div class="wrap loading">Loading your board…</div>`;
  else if(!S.members.size && st.tab !== 'family') html = viewWelcome();
  else html = ({ cal: viewCal, chores: viewChores, meals: viewMeals, lists: viewLists, family: viewFamily })[st.tab]();
  view.innerHTML = html;

  if(keep){ const el = document.getElementById(keep.id); if(el){ el.value = keep.v; el.focus({preventScroll:true}); try{ el.setSelectionRange(keep.s, keep.e); }catch(e){} } }
}

/* ---------- Calendar ---------- */
function occurs(ev, d){
  if(d < ev.date) return false;
  if(ev.until && d > ev.until) return false;
  const a = parse(ev.date), b = parse(d);
  switch(ev.repeat){
    case 'daily': return true;
    case 'weekly': return a.getDay() === b.getDay();
    case 'biweekly': return a.getDay() === b.getDay() && Math.round((b-a)/864e5/7) % 2 === 0;
    case 'monthly': return a.getDate() === b.getDate();
    case 'yearly': return a.getDate() === b.getDate() && a.getMonth() === b.getMonth();
    default: return d === ev.date;
  }
}
function eventsOn(d){
  return all('events').filter(ev => occurs(ev, d)).filter(ev => {
    if(!st.filter.size) return true;
    return (ev.memberIds||[]).some(id => st.filter.has(id));
  }).sort((x,y) => (y.allDay?1:0)-(x.allDay?1:0) || (x.start||'').localeCompare(y.start||''));
}
function evItem(ev, d){
  const ms = (ev.memberIds||[]).map(mem).filter(Boolean);
  const c = ms[0] ? ms[0].color : 'var(--accent)', c2 = ms[1] ? ms[1].color : '';
  const t = ev.allDay ? 'All day' : fmtTime(ev.start);
  const end = !ev.allDay && ev.end ? fmtTime(ev.end) : '';
  const rep = ev.repeat && ev.repeat !== 'none' ? ' ↻' : '';
  return `<button class="ev ${c2?'duo':''}" style="--c:${esc(c)}${c2?';--c2:'+esc(c2):''}" data-act="editEvent" data-id="${esc(ev.id)}" data-date="${d}">
    <span class="ev-t">${t}${end?`<small>${end}</small>`:''}</span><span class="ev-n">${esc(ev.title)}${rep}</span><span class="ev-who">${ms.map(m=>avatar(m,'sm')).join('')}</span></button>`;
}
function dayEvents(d){

  return evs.length ? evs.map(e => evItem(e, d)).join('') + `<button class="addday" data-act="newEvent" data-date="${d}">+ Add</button>`
    : `<button class="free" data-act="newEvent" data-date="${d}">Free. Tap to plan.</button>`;

function choreCount(m, d){
  const dow = parse(d).getDay();
  const due = all('chores').filter(c => c.memberId === m.id && (c.days||[]).includes(dow));
  return { due: due.length, done: due.filter(c => S.choreDone.has(d+'_'+c.id)).length };
}
function allDoneOn(d){

  members().forEach(m => { const x = choreCount(m, d); due += x.due; done += x.done; });

/* ---------- Habits ---------- */
const habitOn = (h, d) => (h.days||[]).includes(parse(d).getDay()) && d >= (h.start || '0000');
const habitDone = (h, d) => S.habitDone.has(d + '_' + h.id);
function streak(h, d){
  // consecutive scheduled days done, counting back from d (today can still be in progress)
  let n = 0, cur = d;
  if(habitOn(h, cur) && !habitDone(h, cur)) cur = addDays(cur, -1);
  for(let i = 0; i < 400; i++){
    if(h.start && cur < h.start) break;
    if(habitOn(h, cur)){ if(habitDone(h, cur)) n++; else break; }
    cur = addDays(cur, -1);
  }
  return n;
}
function viewHabits(){
  const d = st.choreDate, habits = all('habits').sort((a,b) => a.title.localeCompare(b.title));
  const cards = members().map(m => {
    const mine = habits.filter(h => h.memberId === m.id);
    const due = mine.filter(h => habitOn(h, d));
    const rows = due.map(h => {
      const isDone = habitDone(h, d), sk = streak(h, d);
      const dots = [6,5,4,3,2,1,0].map(i => { const x = addDays(d, -i);
        const cls = !habitOn(h, x) ? 'off' : habitDone(h, x) ? 'on' : '';
        return `<i class="${cls}" title="${niceDate(x)}"></i>`; }).join('');
      const hk = 'habit:' + d + '_' + h.id, on = isDone && fxOn(hk);
      return `<div class="habit"><button class="chore ${isDone?'done':''} ${on?'fx':''}" ${on?fxStyle(hk):''} data-act="toggleHabit" data-id="${esc(h.id)}" aria-pressed="${isDone}">
          <span class="tick">${icon.check}</span><span class="chore-n">${h.emoji?esc(h.emoji)+' ':''}${esc(h.title)}<small class="streak">${sk ? `${sk} day streak` : 'Start a streak today'}</small></span>
          <span class="hdots" aria-label="Last 7 days">${dots}</span></button></div>`;
    }).join('');
    const rest = mine.length - due.length;
    const hd = due.filter(h => habitDone(h, d)).length;
    return `<div class="col" style="--c:${esc(m.color)}">

  const meal = { date: sheet.date, slot: sheet.slot, name, ingredients, created: sheet.created };
  if(sheet.who && S.members.has(sheet.who)) meal.who = sheet.who;
  if(sheet.isNew) fx('meal:' + sheet.key, 600);
  put('meals', sheet.key, meal);
  if(addToList && $('#f-list')){
    const listId = $('#f-list').value;
    const existing = new Set(all('items').filter(i => i.listId === listId && !i.done).map(i => i.text.toLowerCase()));
    const lines = ingredients.split('\n').map(s => s.trim()).filter(Boolean).filter(s => !existing.has(s.toLowerCase()));
    lines.forEach((text, i) => put('items', uid()+i, { listId, text, done:false, created: Date.now()+i }));
    toast(lines.length ? `Added ${lines.length} item${lines.length>1?'s':''} to ${S.lists.get(listId)?.name||'your list'}.` : 'Those are already on the list.');
  }
  closeSheet();
}

  if(e.key === 'Escape' && sheet) closeSheet();
  if(e.key === 'Enter' && e.target.id === 'newItem'){ e.preventDefault(); addItem(); }
  if(e.key === 'Enter' && e.target.id === 'passIn'){ e.preventDefault(); unlock(); }
  if(e.key === 'Enter' && e.target.id === 'userIn'){ e.preventDefault(); $('#passIn')?.focus(); }
});
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ st.tab = tabBtn.dataset.tab; window.scrollTo(0,0); render(); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const { act, id } = b.dataset;
  switch(act){
    case 'closeSheet': closeSheet(); break;
    case 'unlock': unlock(); break;
    case 'setTheme': setLook({ theme: b.dataset.k }); break;
    case 'setMode': setLook({ mode: b.dataset.mode }); break;
    case 'lock': if(armed(b)) signOut(); break;
    // calendar
    case 'calMode': st.calMode = b.dataset.mode; if(st.calMode === 'week') st.cursor = fromToday(st.selected); render(); break;
    case 'calPrev': case 'calNext': {
      const n = act === 'calPrev' ? -1 : 1;
      if(st.calMode === 'week') st.cursor = fromToday(addDays(fromToday(st.cursor), 7*n));
      else { const d = parse(st.cursor); st.cursor = ymd(new Date(d.getFullYear(), d.getMonth()+n, 1)); st.selected = st.cursor; }
      render(); break; }
    case 'calToday': st.cursor = st.selected = today(); render(); break;
    case 'pickDay': st.selected = b.dataset.date; render(); break;
    case 'filter': st.filter.has(id) ? st.filter.delete(id) : st.filter.add(id); render(); break;
    case 'newEvent': if(!S.members.size) return memberSheet(); eventSheet(null, b.dataset.date); break;
    case 'editEvent': eventSheet(id); break;
    case 'saveEvent': saveEvent(); break;
    case 'delEvent': if(armed(b)){ del('events', sheet.id); closeSheet(); } break;
    case 'pickMem': { const i = sheet.memberIds.indexOf(id); i<0 ? sheet.memberIds.push(id) : sheet.memberIds.splice(i,1); b.classList.toggle('on', i<0); break; }
    // chores
    case 'choreDay': st.choreDate = addDays(st.choreDate, Number(b.dataset.n)); render(); break;
    case 'choreToday': st.choreDate = today(); render(); break;
    case 'toggleChore': toggleChore(id, b); break;
    case 'goChores': st.tab = 'chores'; st.choreDate = today(); st.choreMode = 'chores'; window.scrollTo(0,0); render(); break;
    case 'toggleAllChores': st.showAllChores = !st.showAllChores; render(); break;
    case 'newChore': choreSheet(); break;
    case 'choreMode': st.choreMode = b.dataset.mode; st.showAllChores = false; render(); break;
    case 'toggleHabit': toggleHabit(id); break;
    case 'newHabit': habitSheet(); break;
    case 'editHabit': habitSheet(id); break;
    case 'saveHabit': saveHabit(); break;
    case 'delHabit': if(armed(b)){ const hid = sheet.id; all('habitDone').filter(x => x.habitId === hid).forEach(x => del('habitDone', x.id)); del('habits', hid); closeSheet(); } break;
    case 'editChore': choreSheet(id); break;
    case 'saveChore': saveChore(); break;
    case 'delChore': if(armed(b)){ del('chores', sheet.id); closeSheet(); } break;
    case 'pickOne': sheet.memberId = id; b.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); break;
    case 'pickDayOfWeek': { const i = Number(b.dataset.i); sheet.days.has(i) ? sheet.days.delete(i) : sheet.days.add(i); b.classList.toggle('on', sheet.days.has(i)); break; }
    case 'daysPreset': sheet.days = new Set(b.dataset.p.split('').map(Number)); document.querySelectorAll('.daypick button').forEach(x => x.classList.toggle('on', sheet.days.has(Number(x.dataset.i)))); break;
    case 'newReward': rewardEditSheet(); break;
    case 'openReward': rewardSheet(id); break;
    case 'editReward': rewardEditSheet(sheet.id); break;
    case 'saveReward': {
      const title = $('#f-title').value.trim(); if(!title){ toast('Name the reward.'); return; }
      const cost = Math.max(1, parseInt($('#f-cost').value, 10) || 1);
      put('rewards', sheet.id || uid(), { title, emoji: $('#f-emoji').value.trim(), cost }); closeSheet(); break; }
    case 'delReward': if(armed(b)){ del('rewards', sheet.id); closeSheet(); } break;
    case 'redeem': {
      const r = S.rewards.get(sheet.id), m = mem(id);
      put('redemptions', uid(), { rewardId: sheet.id, title: r.title, memberId: id, cost: Number(r.cost)||0, date: today() });
      closeSheet(); toast(`${m.name} redeemed ${r.title}. Enjoy!`); break; }
    // meals
    case 'mealWeek': st.mealWeek = fromToday(addDays(fromToday(st.mealWeek), Number(b.dataset.n))); render(); break;
    case 'mealThisWeek': st.mealWeek = today(); render(); break;
    case 'newMeal': mealSheet(null, b.dataset.date); break;
    case 'editMeal': mealSheet(id, b.dataset.date); break;
    case 'pickWho': sheet.who = sheet.who === id ? null : id; b.parentElement.querySelectorAll('.chip').forEach(x => { const on = x.dataset.id === sheet.who; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); }); break;
    case 'pickSlot': sheet.slot = b.dataset.slot; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); break;
    case 'saveMeal': saveMeal(false); break;
    case 'saveMealList': saveMeal(true); break;
    case 'delMeal': del('meals', sheet.key); closeSheet(); break;
    // lists
    case 'pickList': st.listId = id; render(); break;
    case 'newList': listSheet(); break;
    case 'editList': listSheet(st.listId); break;
    case 'saveList': {
      const name = $('#f-title').value.trim(); if(!name){ toast('Name the list.'); return; }
      const nid = sheet.id || uid(); const prev = sheet.id ? S.lists.get(sheet.id) : null;
      put('lists', nid, { name, emoji: $('#f-emoji').value.trim(), order: prev ? (prev.order??0) : Date.now() });
      st.listId = nid; closeSheet(); break; }
    case 'delList': if(armed(b)){
      const lid = sheet.id; all('items').filter(i => i.listId === lid).forEach(i => del('items', i.id)); del('lists', lid); st.listId = null; closeSheet(); } break;
    case 'addItem': addItem(); break;
    case 'toggleItem': { const i = S.items.get(id); if(i){ if(!i.done) fx('item:' + id, 500); put('items', id, { ...i, done: !i.done, doneAt: !i.done ? Date.now() : null }); } break; }
    case 'cycleWho': { const ids = [null, ...members().map(m => m.id)]; st.itemWho = ids[(ids.indexOf(st.itemWho) + 1) % ids.length]; render(); break; }
    case 'itemWho': { const i = S.items.get(id); if(!i) break; const ids = [null, ...members().map(m => m.id)]; const nx = ids[(ids.indexOf(i.who || null) + 1) % ids.length];
      const copy = { ...i }; if(nx) copy.who = nx; else delete copy.who; put('items', id, copy); break; }
    case 'delItem': del('items', id); break;
    case 'clearDone': all('items').filter(i => i.listId === st.listId && i.done).forEach(i => del('items', i.id)); break;
    // family
    case 'newMember': memberSheet(); break;
    case 'editMember': memberSheet(id); break;
    case 'pickColor': sheet.color = b.dataset.c; b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'saveMember': saveMember(); break;
    case 'delMember': if(armed(b)){
      const mid = sheet.id; all('chores').filter(c => c.memberId === mid).forEach(c => del('chores', c.id)); all('habits').filter(h => h.memberId === mid).forEach(h => del('habits', h.id)); del('members', mid);
      st.filter.delete(mid); closeSheet(); } break;
  }
});

boot();
</script>
